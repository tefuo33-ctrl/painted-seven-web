name: Проверка и публикация

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# По умолчанию — только чтение. Право публиковать сайт есть только у шага публикации (deploy).
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      # Ровно те версии, что в package-lock.json, и без скриптов установки пакетов.
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
        env:
          # Адрес сервера для игры с друзьями: Settings → Secrets and variables → Actions → Variables.
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Публикация на GitHub Pages — только с ветки main.
  # Один раз нужно включить: Settings → Pages → Source: GitHub Actions.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
